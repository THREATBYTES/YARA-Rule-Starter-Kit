name: YARA CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile rules
        run: |
          python - <<'PY'
          import pathlib, yara
          files = {str(p): str(p) for p in pathlib.Path("rules").rglob("*.yar")}
          yara.compile(filepaths=files)
          print(f"Compiled {len(files)} rule files successfully")
          PY
      - name: Run rule tests
        run: python scripts/test_rules.py
